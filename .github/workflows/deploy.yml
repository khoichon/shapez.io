name: Build and Deploy shapez

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            gulp/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y default-jre-headless ffmpeg

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Project
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          corepack disable
          npm install -g yarn@1
          yarn install
          cp src/js/core/config.local.template.js src/js/core/config.local.js
          cd gulp && yarn install --network-timeout 30000 && yarn gulp build.web-shapezio

      - name: Check build output
        run: ls -la build/ && ls -la build/v/ 2>/dev/null || echo "no v/ folder"

      - name: Switch to Node 20 for deployment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build --project-name=shapezio